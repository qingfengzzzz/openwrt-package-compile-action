name: Build kmod-ipt-ipset

on:
  workflow_dispatch: 
  push: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential libncurses5-dev gawk git subversion libssl-dev gettext unzip zlib1g-dev file python3
          sudo rm -rf /usr/share/dotnet /etc/mysql /usr/local/lib/android /opt/ghc

      - name: Clone ImmortalWrt Source
        run: |
          # 克隆源码
          git clone --depth 1 -b master https://github.com/immortalwrt/immortalwrt.git
          cd immortalwrt

      - name: Update feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Target and Package
        run: |
          cd immortalwrt
          make defconfig
          
          # 强制锁定目标平台，并选中所需的内核模块
          cat >> .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_generic=y
          CONFIG_PACKAGE_kmod-ipt-ipset=m
          CONFIG_PACKAGE_ipset=m
          CONFIG_PACKAGE_kmod-ipt-core=m
          CONFIG_PACKAGE_kmod-nfnetlink=m
          CONFIG_PACKAGE_libipset=m
          EOF
          
          # 重新生成配置以应用修改
          make defconfig

      - name: Compile kmod
        run: |
          cd immortalwrt
          # 全量编译，确保内核和包都能编译出来
          make -j$(nproc) V=s

      - name: Check output paths (Debug)
        run: |
          cd immortalwrt
          # 打印所有生成的文件，帮你在日志里确认文件到底在哪
          echo "=== Searching for generated APK files ==="
          find bin/ -name "*.apk"

      - name: Upload kmod artifact
        uses: actions/upload-artifact@main
        with:
          name: kmod-ipt-ipset-package
          # 修正后的正确路径（去 packages 目录找，而不是 kmods）
          path: |
            immortalwrt/bin/targets/mediatek/filogic/packages/*.apk
            immortalwrt/bin/packages/*/base/*.apk
          if-no-files-found: warn

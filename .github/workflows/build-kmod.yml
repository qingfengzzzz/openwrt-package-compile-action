name: Build kmod-ipt-ipset

on:
  workflow_dispatch: 
  push: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential libncurses5-dev gawk git subversion libssl-dev gettext unzip zlib1g-dev file python3
          sudo rm -rf /usr/share/dotnet /etc/mysql /usr/local/lib/android /opt/ghc

      - name: Clone ImmortalWrt Source
        run: |
          git clone --depth 1 -b master https://github.com/immortalwrt/immortalwrt.git
          cd immortalwrt

      - name: Update feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Target and Package
        run: |
          cd immortalwrt
          # 先生成基础配置
          make defconfig
          
          # 强制锁定设备平台为 mediatek/filogic
          cat >> .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_generic=y
          CONFIG_PACKAGE_kmod-ipt-ipset=m
          CONFIG_PACKAGE_ipset=m
          CONFIG_PACKAGE_kmod-ipt-core=m
          CONFIG_PACKAGE_kmod-nfnetlink=m
          CONFIG_PACKAGE_libipset=m
          EOF
          
          # 再次计算依赖（这步极其关键，确保 kmod 被选中）
          make defconfig

      - name: Compile kmod
        run: |
          cd immortalwrt
          # 全量编译，由于限制了平台，速度会比之前快一些
          make -j$(nproc) V=s

      - name: Upload kmod artifact
        uses: actions/upload-artifact@main
        with:
          name: kmod-ipt-ipset-package
          # 精确抓取 targets 目录下的 kmod 文件
          path: |
            immortalwrt/bin/targets/mediatek/filogic/kmods/*.ipk
            immortalwrt/bin/targets/mediatek/filogic/kmods/*.apk
          if-no-files-found: error

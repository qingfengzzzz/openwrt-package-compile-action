name: Build kmod-ipt-ipset

on:
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential libncurses5-dev gawk git subversion libssl-dev gettext unzip zlib1g-dev file python3
          # 清理磁盘空间
          sudo rm -rf /usr/share/dotnet /etc/mysql /usr/local/lib/android /opt/ghc

      - name: Clone ImmortalWrt Source
        run: |
          # 拉取 ImmortalWrt 源码（25.12 分支）
          git clone --depth 1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git
          cd immortalwrt

      - name: Update feeds & Install packages
        run: |
          cd immortalwrt
          # 更新并安装 feeds，这是解决 kmod 依赖的关键
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config
        run: |
          cd immortalwrt
          # 生成基础配置
          make defconfig
          # 强制选中你要的 kmod 包
          echo "CONFIG_PACKAGE_kmod-ipt-ipset=m" >> .config
          make defconfig

      - name: Compile kmod
        run: |
          cd immortalwrt
          # 启动编译
          make -j$(nproc) V=s

      - name: Upload kmod artifact
        uses: actions/upload-artifact@main
        with:
          name: kmod-ipt-ipset-package
          path: immortalwrt/bin/packages/*/base/*.ipk
          path: immortalwrt/bin/packages/*/base/*.apk
          if-no-files-found: warn
